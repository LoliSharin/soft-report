<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soft Report</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(50, 140, 255, 0.14), transparent 40%),
          linear-gradient(160deg, #f7f9fc 0%, #eaf0f7 100%);
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: #4b5563;
      }

      dl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        margin: 24px 0 0;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
        background: #f8fafc;
        border: 1px solid #dbe2ea;
      }

      dt {
        font-size: 0.875rem;
        color: #6b7280;
      }

      dd {
        margin: 8px 0 0;
        font-size: 1rem;
        font-weight: 600;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Electron + Node.js</h1>
      <p>
        Базовое окружение готово. Здесь можно развивать desktop-приложение на
        Electron с TypeScript, preload-слоем и отдельным renderer.
      </p>

      <dl>
        <div class="card">
          <dt>Приложение</dt>
          <dd id="app-name">Soft Report</dd>
        </div>
        <div class="card">
          <dt>Платформа</dt>
          <dd id="platform">-</dd>
        </div>
        <div class="card">
          <dt>Electron</dt>
          <dd id="electron-version">-</dd>
        </div>
        <div class="card">
          <dt>Node.js</dt>
          <dd id="node-version">-</dd>
        </div>
      </dl>
    </main>

    <script src="./dist/renderer.js" defer></script>
  </body>
</html>
